name: Sync to Gitee

on:
  push:
    branches: [main]
    tags: ["**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "仅手动测试用：按这个 tag 补同步 Release（留空则只做代码同步）"
        required: false
        default: ""

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync to Gitee (main + tags)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e
          # token 直接嵌 URL 由 GitHub 自动打码
          git remote add gitee "https://freehul:${GITEE_TOKEN}@gitee.com/freehul/winuse.git"

          # Gitee 从 GitHub runner 出发偶发连接重置；两条 push 都是幂等的（--force），
          # 各重试 3 次、退避 5/15 秒，仍失败才判红（网络抖动不该长期记成工作流红）。
          push_with_retry() {
            desc="$1"; shift
            n=0
            for delay in 0 5 15; do
              [ "$delay" -gt 0 ] && sleep "$delay"
              n=$((n + 1))
              if "$@"; then
                echo "[sync] ${desc} 成功（第 ${n} 次尝试）"
                return 0
              fi
              echo "[sync] ${desc} 第 ${n} 次尝试失败"
            done
            echo "[sync] ${desc} 重试 3 次仍失败"
            return 1
          }

          # main 仅在主分支事件推送；tag 事件只同步 tags。
          # 反例（已在别的仓库踩过）：tag 事件里 checkout -B main "$GITHUB_SHA" 再强推，
          # 会把 main 回退到 tag 指向的旧提交，丢掉之后合并的提交。
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            git checkout -B main "$GITHUB_SHA"
            push_with_retry "main 推送" git push gitee main --force
          else
            echo "[sync] 非 main 分支事件（ref=${GITHUB_REF}）：仅同步 tags"
          fi

          push_with_retry "tag 推送" git push gitee --tags --force

      # Release 不随 git 走：Gitee 只镜像分支/标签/提交，Release 页面（标题、正文）
      # 必须单独调 API 建。不补这一步，GitHub 发了新版本、Gitee 那边 Release 列表永远是空的。
      - name: Sync release to Gitee
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.error, urllib.request

          tag = os.environ["TAG"].strip()
          repo = os.environ["REPO"]
          tok = os.environ["GITEE_TOKEN"]
          if not tag:
              print("[release] 没有 tag，跳过")
              raise SystemExit(0)

          info = subprocess.run(
              ["gh", "release", "view", tag, "--repo", repo, "--json", "name,body"],
              capture_output=True, text=True)
          if info.returncode != 0:
              print(f"[release] GitHub 上没有 {tag} 的 Release，跳过（只有 tag 不算 Release）")
              raise SystemExit(0)
          data = json.loads(info.stdout)
          name = data.get("name") or tag
          body = data.get("body") or ""

          api = "https://gitee.com/api/v5/repos/freehul/winuse/releases"

          def call(method, url, payload=None):
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode() if payload is not None else None,
                  method=method,
                  headers={"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read().decode() or "{}")
              except urllib.error.HTTPError as e:
                  print(f"[release] {method} -> HTTP {e.code}: {e.read().decode()[:300]}")
                  return None

          listing = call("GET", f"{api}?access_token={tok}") or []
          existing = next((x for x in listing if x.get("tag_name") == tag), None)

          if existing:
              # Gitee 的 PATCH 对必填字段做校验（漏 tag_name 会 400），与 POST 保持同形
              payload = {"access_token": tok, "tag_name": tag, "name": name,
                         "body": body, "prerelease": False}
              ok = call("PATCH", f"{api}/{existing['id']}", payload)
              if not ok:
                  print(f"[release] {tag} 更新失败")
                  raise SystemExit(1)
              print(f"[release] Gitee Release {tag} 已更新（id {existing['id']}）")
          else:
              payload = {"access_token": tok, "tag_name": tag, "name": name, "body": body,
                         "prerelease": False, "target_commitish": "main"}
              ok = call("POST", api, payload)
              if not ok:
                  print(f"[release] {tag} 创建失败")
                  raise SystemExit(1)
              print(f"[release] Gitee Release {tag} 已创建")
          PY
